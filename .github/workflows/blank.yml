name: Waka Readme

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Test WakaTime OAuth
        env:
          WAKA_TOKEN: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          echo "Testing Bearer Authentication"

          curl -s -o /dev/null -w "HTTP: %{http_code}\n" \
            -H "Authorization: Bearer $WAKA_TOKEN" \
            https://api.wakatime.com/api/v1/users/current/stats/last_7_days

          echo "Testing Basic Authentication"

          ENCODED=$(printf '%s' "$WAKA_TOKEN" | base64 -w 0)

          curl -s -o /dev/null -w "HTTP: %{http_code}\n" \
            -H "Authorization: Basic $ENCODED" \
            https://api.wakatime.com/api/v1/users/current/stats/last_7_days

      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          API_BASE_URL: https://api.wakatime.com/api
