name: Update Waka README
on:
  # Daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Twisuki/custom_waka_readme@v2
        with:
          wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
